<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storage</title>
  </head>
  <body> 
    <h1>Session storage example</h1>
    <h1>Counter : <span id="span1"></span></h1>
    <button onclick="inc1()">INC</button>
    <button onclick="dec1()">DEC</button>

    <script>
      var counter1;
      if (window.sessionStorage.getItem("counter1")) {     //checking counter1
        counter1 = window.sessionStorage.getItem("counter1");  //assign session storage to counter1
      } else {
        counter1 = 0;        
      }

      document.getElementById("span1").innerHTML = counter1; //displaying counter1 on UI

      function inc1() {
        counter1++;
        document.getElementById("span1").innerHTML = counter1;
        window.sessionStorage.setItem("counter1", counter1); //storing counter1 value in session storage.
      }
      function dec1() {
        counter1--;
        document.getElementById("span1").innerHTML = counter1;
        window.sessionStorage.setItem("counter1", counter1); //storing counter1 value in session storage.
      }
    </script>

</html>
